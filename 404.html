<!DOCTYPE html>
<html lang="ja">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません | 渋沢連合自治会</title>
<link rel="icon" type="image/png" href="/images/meta/favicon-32.png">
<link rel="apple-touch-icon" href="/images/meta/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#4ecb8d;--mint-l:#e8faf2;--mint-d:#2ea86b;
  --coral:#ff6b6b;--coral-l:#fff0f0;
  --sky:#4dabf7;--sky-l:#e8f4ff;
  --amber:#ffd43b;--amber-l:#fff9db;
  --lavender:#b197fc;--lavender-l:#f3f0ff;
  --text:#1a1a2e;--text2:#4a4a6a;--text3:#8888aa;
  --bg:#f8f9fe;--white:#fff;--border:#e8e8f0;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;}
a{text-decoration:none;color:inherit;}

/* 背景バルーン */
.bg-balloons{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.balloon{position:absolute;border-radius:50%;opacity:.15;animation:balloonDrift linear infinite;filter:blur(1px);}
.b1{width:180px;height:180px;background:radial-gradient(circle,var(--mint),var(--sky));top:8%;left:2%;animation-duration:22s;}
.b2{width:120px;height:120px;background:radial-gradient(circle,var(--coral),#ffa94d);top:20%;right:4%;animation-duration:28s;animation-delay:-5s;}
.b3{width:90px;height:90px;background:radial-gradient(circle,var(--amber),#ffe066);top:60%;left:1%;animation-duration:20s;animation-delay:-8s;}
.b4{width:150px;height:150px;background:radial-gradient(circle,var(--lavender),var(--sky));top:70%;right:2%;animation-duration:25s;animation-delay:-12s;}
@keyframes balloonDrift{
  0%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-24px) scale(1.03);}
  100%{transform:translateY(0) scale(1);}
}

/* HEADER */
header{background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.06);}
.header-inner{max-width:800px;margin:0 auto;padding:0 24px;height:62px;display:flex;align-items:center;gap:14px;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-img{width:40px;height:40px;border-radius:10px;object-fit:cover;box-shadow:0 3px 10px rgba(78,203,141,.3);}
.logo-pref{font-size:10px;color:var(--text3);}
.logo-name{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:700;color:var(--text);}

/* MAIN */
.main{max-width:560px;margin:0 auto;padding:100px 24px 120px;position:relative;z-index:1;text-align:center;}
.error-badge{display:inline-flex;align-items:center;gap:6px;background:var(--coral-l);color:#d63031;font-size:11px;font-weight:700;letter-spacing:.12em;padding:5px 14px;border-radius:20px;margin-bottom:24px;}
.error-code{font-family:'Noto Serif JP',serif;font-size:clamp(56px,10vw,88px);font-weight:700;color:var(--text);line-height:1;margin-bottom:16px;background:linear-gradient(135deg,var(--mint),var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.error-title{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:700;color:var(--text);margin-bottom:14px;}
.error-desc{font-size:14px;color:var(--text2);line-height:1.9;margin-bottom:36px;}
.error-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-p{background:linear-gradient(135deg,var(--mint),var(--mint-d));color:#fff;font-size:13px;font-weight:700;padding:13px 28px;border-radius:12px;box-shadow:0 6px 20px rgba(78,203,141,.4);transition:transform .2s,box-shadow .2s;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(78,203,141,.5);}
.btn-g{background:#fff;color:var(--mint-d);font-size:13px;font-weight:700;padding:13px 24px;border-radius:12px;border:2px solid var(--mint);transition:background .2s,transform .2s;}
.btn-g:hover{background:var(--mint-l);transform:translateY(-2px);}

/* FOOTER */
footer{background:linear-gradient(160deg,#1a2340 0%,#1e2b4a 100%);padding:32px 24px;text-align:center;position:relative;z-index:1;}
.footer-copy{font-size:11px;color:rgba(255,255,255,.3);}
</style>
</head>
<body>

<div class="bg-balloons">
  <div class="balloon b1"></div><div class="balloon b2"></div>
  <div class="balloon b3"></div><div class="balloon b4"></div>
</div>

<header>
  <div class="header-inner">
    <a class="logo" href="/">
      <img class="logo-img" src="/images/meta/apple-touch-icon.png" alt="渋沢連合自治会">
      <div>
        <div class="logo-pref">横浜市都筑区</div>
        <div class="logo-name">渋沢連合自治会</div>
      </div>
    </a>
  </div>
</header>

<main class="main">
  <div class="error-badge">✦ 404 NOT FOUND</div>
  <div class="error-code">404</div>
  <h1 class="error-title">ページが見つかりませんでした</h1>
  <p class="error-desc">
    お探しのページは移動または削除された可能性があります。<br>
    URLをご確認いただくか、トップページからお探しください。
  </p>
  <div class="error-btns">
    <a href="/" class="btn-p">トップページへ戻る</a>
    <a href="/contact" class="btn-g">お問い合わせ</a>
  </div>
</main>

<footer>
  <div class="footer-copy">© 渋沢連合自治会</div>
</footer>

</body>
</html>
