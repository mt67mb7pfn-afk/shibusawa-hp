<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません | 渋沢連合自治会</title>
<link rel="icon" type="image/png" href="/images/meta/favicon-32.png">
<link rel="apple-touch-icon" href="/images/meta/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
:root{--page-w:800px;}


/* 背景バルーン */

/* HEADER */

/* MAIN */
.main{max-width:560px;margin:0 auto;padding:100px 24px 120px;position:relative;z-index:1;text-align:center;}
.error-badge{display:inline-flex;align-items:center;gap:6px;background:var(--coral-l);color:#d63031;font-size:11px;font-weight:700;letter-spacing:.12em;padding:5px 14px;border-radius:20px;margin-bottom:24px;}
.error-code{font-family:'Noto Serif JP',serif;font-size:clamp(56px,10vw,88px);font-weight:700;color:var(--text);line-height:1;margin-bottom:16px;background:linear-gradient(135deg,var(--mint),var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.error-title{font-family:'Noto Serif JP',serif;font-size:22px;font-weight:700;color:var(--text);margin-bottom:14px;}
.error-desc{font-size:14px;color:var(--text2);line-height:1.9;margin-bottom:36px;}
.error-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-p{background:linear-gradient(135deg,var(--mint),var(--mint-d));color:#fff;font-size:13px;font-weight:700;padding:13px 28px;border-radius:12px;box-shadow:0 6px 20px rgba(78,203,141,.4);transition:transform .2s,box-shadow .2s;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(78,203,141,.5);}
.btn-g{background:#fff;color:var(--mint-d);font-size:13px;font-weight:700;padding:13px 24px;border-radius:12px;border:2px solid var(--mint);transition:background .2s,transform .2s;}
.btn-g:hover{background:var(--mint-l);transform:translateY(-2px);}

/* FOOTER */

</style>
</head>
<body>

<div class="bg-balloons">
  <div class="balloon b1"></div><div class="balloon b2"></div>
  <div class="balloon b3"></div>
</div>

<header>
  <div class="header-inner">
    <a class="logo" href="/">
      <img class="logo-img" src="/images/meta/apple-touch-icon.png" alt="渋沢連合自治会">
      <div>
        <div class="logo-pref">横浜市都筑区</div>
        <div class="logo-name">渋沢連合自治会</div>
      </div>
    </a>
  </div>
</header>

<main class="main">
  <div class="error-badge">✦ 404 NOT FOUND</div>
  <div class="error-code">404</div>
  <h1 class="error-title">ページが見つかりませんでした</h1>
  <p class="error-desc">
    お探しのページは移動または削除された可能性があります。<br>
    URLをご確認いただくか、トップページからお探しください。
  </p>
  <div class="error-btns">
    <a href="/" class="btn-p">トップページへ戻る</a>
    <a href="/contact" class="btn-g">お問い合わせ</a>
  </div>
</main>

<footer>
  <div class="footer-copy">© 渋沢連合自治会</div>
</footer>

</body>
</html>
