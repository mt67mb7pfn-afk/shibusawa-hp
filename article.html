<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トピックス | 渋沢連合自治会</title>
<link rel="icon" type="image/png" href="/images/meta/favicon-32.png">
<link rel="apple-touch-icon" href="/images/meta/apple-touch-icon.png">
<meta name="description" content="渋沢連合自治会のトピックス記事です。">
<meta property="og:type" content="website">
<meta property="og:title" content="トピックス | 渋沢連合自治会">
<meta property="og:description" content="渋沢連合自治会のトピックス記事です。">
<meta property="og:image" content="https://shibusawa-hp.pages.dev/images/meta/ogp-logo.jpg">
<meta property="og:url" content="https://shibusawa-hp.pages.dev/article">
<meta property="og:site_name" content="渋沢連合自治会">
<meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="/common.js"></script>
<style>
:root{--page-w:800px;}


/* 背景バルーン */

/* HEADER */

/* MAIN */
.main{max-width:800px;margin:40px auto;padding:0 24px;position:relative;z-index:1;}

/* パンくず */
.breadcrumb{font-size:12px;color:var(--text3);margin-bottom:24px;display:flex;align-items:center;gap:6px;}
.breadcrumb a{color:var(--coral);}
.breadcrumb a:hover{text-decoration:underline;}

/* 記事ヘッダー */
.article-header{margin-bottom:32px;}
.article-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.article-cat{
  font-size:11px;font-weight:700;
  padding:4px 12px;border-radius:20px;
  background:linear-gradient(135deg,var(--coral),var(--lavender));
  color:#fff;
}
.article-date{font-size:12px;color:var(--text3);}
.article-title{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(20px,3vw,28px);
  font-weight:700;
  color:var(--text);
  line-height:1.4;
  margin-bottom:24px;
}

/* アイキャッチ画像 */
.article-eyecatch{
  width:100%;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:32px;
  background:var(--coral-l);
  aspect-ratio:16/9;
}
.article-eyecatch img{
  width:100%;height:100%;
  object-fit:cover;
}

/* 本文 */
.article-body{
  background:#fff;
  border-radius:16px;
  padding:32px;
  border:2px solid var(--border);
  box-shadow:0 2px 10px rgba(0,0,0,.04);
  margin-bottom:40px;
}
.article-body .body-text{
  font-size:15px;
  color:var(--text2);
  line-height:2;
  white-space:pre-wrap;
  word-break:break-word;
}
/* common.css の a{color:inherit} でリンクが本文と同じ色になるため、記事内だけ戻す */
.article-body a{color:var(--mint-d);text-decoration:underline;text-underline-offset:3px;font-weight:700;}
.article-body a:hover{color:var(--mint);}

/* 戻るボタン */
.back-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:700;
  color:var(--coral);
  padding:12px 24px;
  border-radius:24px;
  background:var(--coral-l);
  border:2px solid var(--coral);
  transition:all .2s;
  margin-bottom:40px;
}
.back-link:hover{background:var(--coral);color:#fff;}

/* ローディング */
.loading{text-align:center;padding:80px 20px;color:var(--text3);}
.loading-spinner{
  width:36px;height:36px;border:3px solid var(--border);
  border-top-color:var(--coral);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* エラー */
.error{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;}

/* アイキャッチクリック可能 */
.article-eyecatch{cursor:zoom-in;}

/* ライトボックス */
.lightbox{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.92);
  align-items:center;justify-content:center;padding:20px;
}
.lightbox.open{display:flex;}
.lightbox-inner{
  position:relative;max-width:90vw;max-height:90vh;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.lightbox-img{
  max-width:100%;max-height:85vh;
  border-radius:12px;object-fit:contain;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.lightbox-close{
  position:fixed;top:20px;right:20px;
  width:40px;height:40px;
  background:rgba(255,255,255,.15);
  border:none;border-radius:50%;
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;z-index:1001;
}
.lightbox-close:hover{background:rgba(255,255,255,.3);}

/* フッター */

</style>
</head>
<body>

<div class="bg-balloons">
  <div class="balloon b1"></div><div class="balloon b2"></div>
  <div class="balloon b3"></div>
</div>

<!-- ライトボックス -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
  </div>
</div>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">
      <img class="logo-img" src="/images/meta/apple-touch-icon.png" alt="">
      <div><div class="logo-pref">横浜市都筑区</div><div class="logo-name">渋沢連合自治会</div></div>
    </a>
    <a class="back-btn" href="topics.html">← 一覧に戻る</a>
  </div>
</header>

<div class="main">
  <!-- パンくず -->
  <div class="breadcrumb">
    <a href="index.html">トップ</a>
    <span>›</span>
    <a href="topics.html">トピックス</a>
    <span>›</span>
    <span id="breadcrumb-title">記事</span>
  </div>

  <!-- 記事コンテンツ -->
  <div id="article-content">
    <div class="loading">
      <div class="loading-spinner"></div>
      読み込み中...
    </div>
  </div>

  <!-- 一覧に戻るボタン -->
  <a class="back-link" href="topics.html">← トピックス一覧に戻る</a>
</div>

<footer>
  <a class="footer-back" href="index.html">← トップページに戻る</a>
  <div class="footer-copy">© Shibusawa Rengo Jichikai All Rights Reserved.</div>
</footer>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxPfmeo3zuEohAdfTuX2OkNh0UV_SNW1JICeIOYNKknLR6YgGoA_ais9QGGhEhdWGK2uw/exec';

const urlParams = new URLSearchParams(window.location.search);
const articleId = urlParams.get('id');

async function loadArticle() {
  const content = document.getElementById('article-content');

  if (!articleId) {
    content.innerHTML = '<div class="error">記事が見つかりませんでした。</div>';
    return;
  }

  try {
    const res = await fetch('/data/topics.json');
    const data = await res.json();
    const topics = data.topics || [];
    const item = topics.find(t => String(t.id) === String(articleId));

    if (!item) {
      content.innerHTML = '<div class="error">記事が見つかりませんでした。</div>';
      return;
    }

    // タイトルを更新
    document.title = `${esc(item.title)} | 渋沢連合自治会`;
    document.getElementById('breadcrumb-title').textContent = item.title;

    // アイキャッチ画像
    const eyecatch = item.imageUrl
      ? `<div class="article-eyecatch" onclick="openLightbox('${esc(item.imageUrl)}','${esc(item.title)}')"><img src="${esc(item.imageUrl)}" alt="${esc(item.title)}"></div>`
      : '';

    content.innerHTML = `
      <div class="article-header">
        <div class="article-meta">
          <span class="article-cat">${esc(item.category)}</span>
          <span class="article-date">${esc(item.date)}</span>
        </div>
        <h1 class="article-title">${esc(item.title)}</h1>
      </div>
      ${eyecatch}
      <div class="article-body">
        <div class="body-text">${item.body || ''}</div>
      </div>`;

  } catch(e) {
    document.getElementById('article-content').innerHTML =
      '<div class="error">データの読み込みに失敗しました。<br>しばらくしてから再度お試しください。</div>';
  }
}

// ライトボックス
function openLightbox(src, alt) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

loadArticle();
</script>
</body>
</html>
