<link rel="icon" type="image/png" href="/images/meta/favicon-32.png">
<link rel="apple-touch-icon" href="/images/meta/apple-touch-icon.png">
<meta name="description" content="渋沢連合自治会からのお知らせ詳細です。">
<meta property="og:type" content="website">
<meta property="og:title" content="お知らせ詳細 | 渋沢連合自治会">
<meta property="og:description" content="渋沢連合自治会からのお知らせ詳細です。">
<meta property="og:image" content="https://shibusawa-hp.pages.dev/images/meta/ogp-logo.jpg">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="/common.js"></script>
<style>
:root{--page-w:900px;}


/* ヘッダー */

.logo-wrap{display:flex;flex-direction:column;}

/* メイン */
.main{max-width:760px;margin:40px auto;padding:0 20px 80px;position:relative;z-index:1;}

/* バッジ */
.n-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:12px;}
.nb-info{background:var(--sky-l);color:var(--sky);}
.nb-new{background:var(--coral-l);color:var(--coral);}
.nb-event{background:var(--amber-l);color:#b8860b;}
.nb-topics{background:var(--lavender-l);color:var(--lavender);}
.nb-kairan{background:var(--mint-l);color:var(--mint-d);}

/* 記事カード */
.article-card{background:#fff;border-radius:16px;border:2px solid var(--border);padding:36px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.article-date{font-size:13px;color:var(--text3);margin-bottom:8px;}
.article-title{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:700;color:var(--text);line-height:1.5;margin-bottom:20px;}
.article-divider{width:48px;height:3px;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:2px;margin-bottom:24px;}
.article-desc{font-size:14px;color:var(--text2);margin-bottom:20px;padding:12px 16px;background:var(--bg);border-radius:8px;border-left:3px solid var(--mint);}
.article-body{font-size:15px;color:var(--text);line-height:1.9;white-space:pre-wrap;word-break:break-word;}
/* common.css の a{color:inherit} でリンクが本文と同じ色になるため、記事内だけ戻す */
.article-body a,.article-desc a{color:var(--mint-d);text-decoration:underline;text-underline-offset:3px;font-weight:700;}
.article-body a:hover,.article-desc a:hover{color:var(--mint);}
.article-image{width:100%;border-radius:12px;margin-bottom:24px;object-fit:cover;max-height:400px;}
.article-eyecatch{cursor:zoom-in;}
.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px;}
.lightbox.open{display:flex;}
.lightbox-inner{position:relative;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;align-items:center;gap:12px;}
.lightbox-img{max-width:100%;max-height:85vh;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox-close{position:absolute;top:-40px;right:0;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;}
.article-link{display:inline-flex;align-items:center;gap:6px;margin-top:24px;padding:10px 20px;background:var(--mint);color:#fff;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;transition:background .2s;}
.article-link:hover{background:var(--mint-d);}

/* ローディング */
.loading{text-align:center;padding:60px;color:var(--text3);}
</style>
</head>
<body>
<div class="bg-balloons">
  <div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div>
</div>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">
      <img class="logo-img" src="/images/meta/apple-touch-icon.png" alt="">
      <div>
      <div class="logo-pref">横浜市都筑区</div>
        <div class="logo-name">渋沢連合自治会</div>
      </div>
    </a>
    <a class="back-btn" href="news.html">← お知らせ一覧</a>
  </div>
</header>

<div class="main">
  <div id="article-content"><div class="loading">読み込み中...</div></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxPfmeo3zuEohAdfTuX2OkNh0UV_SNW1JICeIOYNKknLR6YgGoA_ais9QGGhEhdWGK2uw/exec';
const BADGE_MAP = {'NEW':'nb-new','お知らせ':'nb-info','掲示板':'nb-kairan','イベント':'nb-event','トピックス':'nb-topics'};

async function loadArticle() {
  const params = new URLSearchParams(location.search);
  const date = params.get('date');
  const content = document.getElementById('article-content');

  if (!date) {
    content.innerHTML = '<div class="loading">記事が見つかりません</div>';
    return;
  }

  try {
    const res = await fetch('/data/news.json');
    const data = await res.json();
    const title = params.get('title');
    const item = (data.news || []).find(n => n.date === date && (!title || n.title === title));

    if (!item) {
      content.innerHTML = '<div class="loading">記事が見つかりません</div>';
      return;
    }

    // ページタイトル更新
    document.title = item.title + ' | 渋沢連合自治会';

    const bc = BADGE_MAP[item.badge] || 'nb-info';

    content.innerHTML = `
      <div class="article-card">
        <span class="n-badge ${bc}">${esc(item.badge)}</span>
        <div class="article-date">${esc(item.date)}</div>
        <h1 class="article-title">${esc(item.title)}</h1>
        <div class="article-divider"></div>
        ${item.imageUrl ? `<img class="article-image article-eyecatch" src="${esc(item.imageUrl)}" alt="${esc(item.title)}" onclick="openLightbox(this.src)">` : ''}
        ${item.description ? `<div class="article-desc">${esc(item.description)}</div>` : ''}
        ${item.body ? `<div class="article-body">${item.body}</div>` : ''}
        ${item.url && item.url !== '#' && item.url !== 'news.html' ? `<a class="article-link" href="${esc(item.url)}" target="_blank" rel="noopener">詳細はこちら →</a>` : ''}
      </div>
    `;
  } catch(e) {
    content.innerHTML = '<div class="loading">読み込みに失敗しました</div>';
  }
}

loadArticle();
</script>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
  </div>
</div>
<script>
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
</script>
<footer>
  <a class="footer-back" href="index.html">← ホームに戻る</a>
  <div class="footer-copy">© 渋沢連合自治会</div>
</footer>

</body>
</html>
